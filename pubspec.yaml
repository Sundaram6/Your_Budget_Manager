name: your_budget_manager
description: A privacy-first personal finance companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Navigation
  go_router: ^14.8.1

  # Security
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # Entities & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.6.0

  # UI & Animation
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  lottie: ^3.5.1
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  mocktail: ^1.0.5
  alchemist: ^0.10.0
  mockito: ^5.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
